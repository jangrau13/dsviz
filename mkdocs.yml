# The documentation site: the language reference, and only that.
#
# The pages under `docs/` are generated by `docs.py --site docs` from the same
# tables the editor reads for hovers and completions, so the written reference
# cannot describe a language the tool does not implement. Regenerate after
# changing `langserver.DOCS`.
#
#     python docs.py --site docs && mkdocs build
#
# `llmstxt` emits llms.txt and llms-full.txt beside the HTML, so the same
# markdown serves a reader browsing the site and a model reading it.
site_name: dsviz
site_description: The dsviz language reference.
site_url: https://jangrau13.github.io/dsviz/
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

extra_javascript:
  - assets/js/search-shortcut.js

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

plugins:
  - search
  - llmstxt:
      markdown_description: >-
        The reference for the dsviz language. A program declares kinds of
        machine, makes instances of them, collects them into a world, and
        runs a job in that world. These pages describe those constructs and
        nothing else.
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
        The language:
          - language/*.md

# The language reference, and nothing else. Two rules hold this site down:
# there is no page per task, and no page is organised around a use case. The
# sections below are language constructs — what a machine is, what a world is,
# what a job is. Which of them a given exercise needs is the exercise's
# business, and how to make one work is the student's.
nav:
  - Overview: index.md
  - The language:
      - Writing a program: language/index.md
      - Functions: language/functions.md
      - Machines: language/machines.md
      - Machines you can buy: language/machines-you-can-buy.md
      - Worlds: language/worlds.md
      - Jobs: language/jobs.md
      - Messages: language/messages.md
      - Datasets: language/datasets.md
      - Checks: language/checks.md
      - Built-in functions: language/builtins.md
